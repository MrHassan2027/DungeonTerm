[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dungeonterm"
version = "1.0.0"
description = "Roguelike dungeon crawler in the terminal"
requires-python = ">=3.11"
dependencies = ["windows-curses>=2; sys_platform=='win32'"]

[project.scripts]
dungeonterm = "dungeonterm.__main__:main"
